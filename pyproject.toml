[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# Installed as dagan-contigviz, imported as contigviz.
name = "dagan-contigviz"
version = "0.1.0"
description = "Load contigs and their features from the Dagan lab databases, assign categories to them and plot them with pygenomeviz."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "jordiweijers" }]
dependencies = [
    "matplotlib>=3.5",
    "mysql-connector-python>=8.0",
    "numpy>=1.21",
    "pygenomeviz>=1.0",
    "scipy>=1.7",
]

[project.urls]
Repository = "https://github.com/jordiweijers/plot_plasmid"

[tool.setuptools.packages.find]
where = ["src"]
