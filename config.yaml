# Configuration for plot_plasmid.
#
# connection:  how to reach the MySQL server.
# databases:   one schema per MySQL database, describing where contigs and features live.
#              Table and column names, and the is_pseudo expressions, are inserted into
#              the SQL queries as-is, so is_pseudo is an SQL expression evaluated by MySQL.
# categories:  colour proteins, pseudogenes, protein families or contigs whose IDs are
#              listed in a file or returned by an SQL query.

connection:
  host: localhost
  user: gmg

# Each database has:
#   contigs:   information about the contigs table
#     table: name of the contigs table
#     id_column: name of the column containing contig IDs
#     length_column: name of the column containing contig lengths
#   features:  list of feature sources (proteins, pseudogenes, etc.)
#     table: name of the features table
#     id_column: name of the column containing feature IDs
#     contig_column: name of the column containing contig IDs
#     is_pseudo: SQL expression evaluated by MySQL to determine if the feature is a pseudogene
#     mcl_table: name of the MCL table
#     mcl_id_column: name of the column containing feature IDs in the MCL table
#     mcl_family_column: name of the column containing MCL family IDs
databases:
  kes2021:
    contigs:
      table: contigs
      id_column: contig_ID
      length_column: Size
    features:
      - table: proteins
        id_column: id
        contig_column: contig_ID
        is_pseudo: "FALSE"    # SQL expression evaluated by MySQL
        mcl_table: mcl30
        mcl_id_column: id
        mcl_family_column: clust
      - table: pseudogenes
        id_column: pseudo_id
        contig_column: contig_ID
        is_pseudo: "TRUE"    # SQL expression evaluated by MySQL
        mcl_table: pmcl
        mcl_id_column: pseudo_id
        mcl_family_column: clust

  ESKAPEE25:
    contigs:
      table: contigs
      id_column: contig_id
      length_column: size
    features:
      - table: proteins
        id_column: id
        contig_column: contig_id
        is_pseudo: "FALSE"    # SQL expression evaluated by MySQL
        mcl_table: mcl
        mcl_id_column: id
        mcl_family_column: clust
      - table: pseudogenes
        id_column: pseudo_id
        contig_column: contig_id
        is_pseudo: "TRUE"    # SQL expression evaluated by MySQL
        mcl_table: pmcl
        mcl_id_column: pseudo_id
        mcl_family_column: clust

  pantoea2025_v2:
    contigs:
      table: contigs
      id_column: contig_id
      length_column: contig_length
    features:
      - table: features_cds
        id_column: cds_id
        contig_column: contig_id
        is_pseudo: "FIND_IN_SET('pseudo', REPLACE(attributes, ';', ',')) > 0"    # SQL expression evaluated by MySQL
        mcl_table: mcls
        mcl_id_column: cds_id
        mcl_family_column: mcl_id

# Each category has:
#   name:      label shown in the plot legend
#   color:     colour of the features (or contig labels) in this category, in quotes
#   type:      what the IDs refer to: protein, pseudo, family (an MCL family: colours all
#              its proteins and pseudogenes) or contig (colours the contig label)
#   database:  the database this category applies to; make another category for another database
#   query:     path to an SQL file that returns one column of IDs from the whole database (optional)
#   path:      path to a file with one ID per line; blank lines and lines starting with # are skipped (optional)
# Give a query, a path, or both:
#   query only:  the query runs once on every plot.
#   path only:   the IDs are read from the file, e.g. a list you made yourself.
#   both:        the query runs once and its IDs are saved at path; later plots read the file.
#                The query runs again when the SQL file changes, when a table it uses changes,
#                or with --refresh-cache.
# Paths are relative to this file. The first category that matches wins, so order sets the priority.
# In MySQL, REGEXP ignores case; use REGEXP BINARY for a case-sensitive match.
categories:
  - name: AMR
    color: '#33ffff'
    type: protein
    database: kes2021
    query: queries/kes2021/amr_proteins.sql
    path: cache/kes2021/amr_proteins.txt

  - name: Replication
    color: '#5e2bff'
    type: family
    database: kes2021
    query: queries/kes2021/replication_families.sql
    path: cache/kes2021/replication_families.txt

  - name: Conjugation
    color: '#8b0000'
    type: family
    database: kes2021
    query: queries/kes2021/conjugation_families.sql
    path: cache/kes2021/conjugation_families.txt

  - name: AMR
    color: '#33ffff'
    type: protein
    database: ESKAPEE25
    query: queries/ESKAPEE25/amr_proteins.sql
    path: cache/ESKAPEE25/amr_proteins.txt

  - name: Replication
    color: '#5e2bff'
    type: family
    database: ESKAPEE25
    query: queries/ESKAPEE25/replication_families.sql
    path: cache/ESKAPEE25/replication_families.txt

  - name: Conjugation
    color: '#8b0000'
    type: family
    database: ESKAPEE25
    query: queries/ESKAPEE25/conjugation_families.sql
    path: cache/ESKAPEE25/conjugation_families.txt

  - name: Replication
    color: '#5e2bff'
    type: family
    database: pantoea2025_v2
    query: queries/pantoea2025_v2/replication_families.sql
    path: cache/pantoea2025_v2/replication_families.txt

  - name: Conjugation
    color: '#8b0000'
    type: family
    database: pantoea2025_v2
    query: queries/pantoea2025_v2/conjugation_families.sql
    path: cache/pantoea2025_v2/conjugation_families.txt
